<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Athenyx: No proof? No finding.</title>
<link rel="stylesheet" href="cartoon.css" />
<style>
  body { background: var(--sky); }
  .rays { --rx: 62%; --ry: 56%; }

  .title { position: absolute; left: 48px; top: 48px; }
  .title .a { font-size: 104px; }
  .title .b { font-size: 112px; margin-top: 4px; display: inline-block; transform: rotate(-2deg); }

  .paper {
    position: absolute;
    left: 318px; top: 318px;
    width: 400px; height: 480px;
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 22px;
    box-shadow: 10px 12px 0 var(--ink);
    transform: rotate(4deg);
    padding: 54px 34px 0;
  }
  .paper .dots3 { position: absolute; left: 24px; top: 20px; display: flex; gap: 8px; }
  .paper .dots3 i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); }
  .line { height: 18px; border-radius: 9px; margin-bottom: 20px; background: #e4ecf5; position: relative; }
  .line.hot { background: var(--yellow); border: 3px solid var(--ink); height: 26px; margin: -4px -14px 16px; }
  .circle-scribble { position: absolute; left: -34px; top: -30px; width: 420px; height: 86px; }

  .stamp {
    position: absolute;
    right: 18px; bottom: 26px;
    transform: rotate(-12deg);
    border: 5px solid #16a34a;
    color: #16a34a;
    border-radius: 12px;
    padding: 8px 16px 6px;
    font-family: "Bricolage Grotesque";
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 0.02em;
    line-height: 1;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #16a34a;
  }

  .pop.det { --w: 300px; --c: var(--yellow); left: 34px; top: 560px; }

  .bubble.say { left: 214px; top: 470px; width: 290px; height: 84px; font-size: 30px; white-space: nowrap; text-align: center; --tx: 60px; --tr: 45deg; transform: rotate(-4deg); }

  .brand { right: 52px; bottom: 40px; }
</style>
</head>
<body>
<div class="rays"></div>
<div class="dots" style="right:0;top:0;width:300px;height:280px;-webkit-mask:linear-gradient(225deg,#000,transparent 70%)"></div>

<div class="title head">
  <div class="a">No proof?</div>
  <div class="b outline">No finding.</div>
</div>

<div class="paper">
  <div class="dots3"><i style="background:#ff7b5c"></i><i style="background:#ffd60a"></i><i style="background:#8ee6b9"></i></div>
  <div class="line" style="width:62%"></div>
  <div class="line" style="width:84%;background:#ffe1ea"></div>
  <div class="line" style="width:48%"></div>
  <div class="line hot">
    <svg class="circle-scribble" viewBox="0 0 420 86" fill="none"><path d="M30 46 C 40 8, 380 2, 404 36 C 424 70, 120 88, 40 70 C 8 62, 14 30, 70 18" stroke="#ff4d2e" stroke-width="6" stroke-linecap="round"/></svg>
  </div>
  <div class="line" style="width:74%;background:#e2f7ec"></div>
  <div class="line" style="width:56%"></div>
  <div class="line" style="width:80%;background:#ffe1ea"></div>
  <div class="stamp">PROOF ✓</div>
</div>

<img class="emoji" src="../assets/magnifier.svg" style="left:488px;top:392px;width:230px;transform:rotate(8deg)" alt="" />

<div class="pop det"><div class="disc"></div><img src="../assets/detective.svg" alt="" /></div>

<div class="bubble say">Show me the line!</div>

<div class="brand" data-brand></div>

<script src="cartoon.js"></script>
<script>
  confetti({ seed: 21, count: 34, zones: [[360, 830, 380, 60], [600, 60, 150, 200], [20, 300, 260, 160]] });
</script>
</body>
</html>
