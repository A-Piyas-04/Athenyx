services:
  postgres:
    image: postgres:16
    container_name: athenyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: athenyx
      POSTGRES_PASSWORD: athenyx
      POSTGRES_DB: athenyx
    ports:
      - "5432:5432"
    volumes:
      - athenyx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenyx -d athenyx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  athenyx-pgdata:
